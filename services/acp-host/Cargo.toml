[package]
name = "lci-acp-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ACP client that drives an `opencode acp` subprocess — the agent-plane supervisor foundation (RFC-0009 / ADR-0094)."
publish = false

[lib]
path = "src/lib.rs"

# Verification/smoke binary: drives a real `opencode acp` (initialize + session/new) and prints the
# handshake. Not a deployed entrypoint — the supervisor proper is a later slice.
[[bin]]
name = "acp-smoke"
path = "src/bin/acp-smoke.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
