[package]
name = "lci-review-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stdio MCP server exposing the review agent's tuned tools to an OpenCode ACP host (RFC-0009 / ADR-0094 review cutover, slice 1)."
publish = false

[[bin]]
name = "lci-review-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Reuse the EXACT tuned review tools (schemas + dispatch + internal-API proxying) — this crate is a
# thin MCP wrapper, not a re-implementation. See tools::Tools::{new,specs,dispatch}.
lci-review-agent = { path = "../review-agent" }
lci-agent-clients = { path = "../agent-clients" }
lci-agent-types = { path = "../agent-types" }
# The `run_sast` tool (ADR-0073) reuses this verbatim; also the SastConfig env round-trip the supervisor
# hands us across the process boundary (ADR-0097).
lci-agent-sast = { path = "../agent-sast" }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
