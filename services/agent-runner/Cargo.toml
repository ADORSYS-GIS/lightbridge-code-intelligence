[package]
name = "agent-runner"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightbridge agent runner: the per-task Kubernetes Job that clones, indexes, and reviews a repo."

[[bin]]
name = "agent-runner"
path = "src/main.rs"

# Versions + features are centralized in the workspace root Cargo.toml.
[dependencies]
anyhow.workspace = true
lci-config = { path = "../config" }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
uuid.workspace = true
# Regex selectors for the per-tier `mcp__<server>__<tool>` tool allowlist (ADR-0066).
regex.workspace = true
# Run-config audit trail (ADR-0034/0062/0066): base64-encode the redacted resolved review config;
# url strips userinfo/query credentials from the persisted base_url.
base64.workspace = true
url.workspace = true
# Tree-sitter syntax-aware chunking (ADR-0010).
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true

[dev-dependencies]
# HTTP mocking for the control-plane client contract tests (no live control plane).
wiremock.workspace = true
tempfile.workspace = true
# ADR-0075 (#300) transport-fidelity spike ONLY — a dev/test dependency, never a runtime dep of the
# review path. Pinned EXACTLY so the harness verdict is reproducible against one known rig release.
# The harness (`tests/rig_fidelity.rs`) checks whether rig's OpenAI-compatible provider preserves the
# provider-quirk fields our hand-rolled transport (`src/review/native/chat.rs`) depends on.
rig-core = "=0.39.0"
# The live probe links two rustls providers in one test binary (workspace `ring` via agent-runner's
# reqwest, plus `aws-lc-rs` pulled by rig-core → reqwest 0.13). Install one process default up front so
# the first TLS handshake can't hit the rustls-0.23 ambiguous-provider panic (#264 family).
rustls.workspace = true
