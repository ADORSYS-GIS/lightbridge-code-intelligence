[package]
name = "agent-runner"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightbridge agent runner: the per-task Kubernetes Job that clones, indexes, and reviews a repo."

[[bin]]
name = "agent-runner"
path = "src/main.rs"

# The consolidated agent execution plane (ADR-0085), selected by `mode × host`. Additive this slice:
# the deployed image still runs `agent-runner`; the dispatcher cutover to `agent-plane` is a later
# one-liner. Named explicitly so the binary is `agent-plane`, not the file-derived `agent_plane`.
[[bin]]
name = "agent-plane"
path = "src/bin/agent_plane.rs"

# Versions + features are centralized in the workspace root Cargo.toml.
[dependencies]
anyhow.workspace = true
# Flag+env parsing for the `agent-plane` binary's `mode × host` selection (ADR-0085, src/bin/agent_plane.rs).
clap.workspace = true
lci-agent-clients = { path = "../agent-clients" }
lci-agent-loop = { path = "../agent-loop" }
# SAST (opengrep) scan/buffer/digest, invoked as the `run_sast` tool (ADR-0073); the bootstrap config
# resolver here builds its `SastConfig` value from env/file, then hands it to the tool registry.
lci-agent-sast = { path = "../agent-sast" }
# Host-agnostic live per-review status projection + read-only HTTP surface (RFC-0007 slice 5,
# ADR-0085). Flag-gated (`LCI_STATUS_API`, default off) so it is prod-neutral until an operator
# enables it; the loop runs identically whether or not the status server is on.
lci-agent-status = { path = "../agent-status" }
lci-agent-step = { path = "../agent-step" }
lci-agent-tools = { path = "../agent-tools" }
lci-agent-types = { path = "../agent-types" }
lci-review-agent = { path = "../review-agent" }
# ACP transport for the OpenCode review host (RFC-0009 / ADR-0094): spawns + drives `opencode acp`.
lci-acp-host = { path = "../acp-host" }
lci-config = { path = "../config" }
# In-house code-graph crate (ADR-0086 / RFC-0007 slice 1). The sole structural-graph engine, built
# in-process (tree-sitter); replaced the retired Python Graphify CLI (ADR-0019).
#
# It now lives in its OWN repository — https://github.com/vymalo/codegraph — and is no longer a
# workspace member here. Pinned by exact `rev`, not a branch: a floating branch would make every
# build of this workspace depend on whatever landed upstream that hour, which is precisely the kind
# of moving target this repo has been bitten by before. Bump the rev deliberately, in its own PR.
#
# This is a git dependency because the crate is not published yet. Once `lci-codegraph` is released
# to crates.io, replace this whole entry with a plain `lci-codegraph = "<version>"` — no other change
# is needed, the import path and API are identical.
lci-codegraph = { git = "https://github.com/vymalo/codegraph", rev = "03aa2b4bb573896ef62e5f5330bb4b39e090b0b5" }
# Shared tracing/OTel bootstrap (ticket #246): JSON logs (as before) + optional OTLP→Tempo export, plus
# the crypto-provider pin this binary needs but never had (see lci-observability's doc comment).
lci-observability = { path = "../observability" }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
reqwest.workspace = true
uuid.workspace = true
# Regex selectors for the per-tier `mcp__<server>__<tool>` tool allowlist (ADR-0066).
regex.workspace = true
# Tolerant JSONC parsing for the repo-owned `.lightbridge-code-review.jsonc` (ADR-0030).
jsonc-parser.workspace = true
# `focus`/`ignore` glob filtering for the repo config (ADR-0030), same gitignore-semantics engine
# `lci-codegraph`'s `IgnoreList` already uses for an operator-configurable glob list.
ignore.workspace = true
# Run-config audit trail (ADR-0034/0062/0066): base64-encode the redacted resolved review config;
# url strips userinfo/query credentials from the persisted base_url.
base64.workspace = true
url.workspace = true
# Tree-sitter syntax-aware chunking (ADR-0010).
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true

[dev-dependencies]
lci-agent-testkit = { path = "../agent-testkit" }
# HTTP mocking for the control-plane client contract tests (no live control plane).
wiremock.workspace = true
tempfile.workspace = true
# ADR-0075 (#300) transport-fidelity spike ONLY — a dev/test dependency, never a runtime dep of the
# review path. Pinned EXACTLY so the harness verdict is reproducible against one known rig release.
# The harness (`tests/rig_fidelity.rs`) checks whether rig's OpenAI-compatible provider preserves the
# provider-quirk fields our hand-rolled transport (`lci_review_agent::model`) depends on.
rig-core = "=0.39.0"
# The live probe links two rustls providers in one test binary (workspace `ring` via agent-runner's
# reqwest, plus `aws-lc-rs` pulled by rig-core → reqwest 0.13). Install one process default up front so
# the first TLS handshake can't hit the rustls-0.23 ambiguous-provider panic (#264 family).
rustls.workspace = true
