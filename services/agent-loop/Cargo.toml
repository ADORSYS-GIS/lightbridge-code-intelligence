[package]
name = "lci-agent-loop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime-agnostic execution loop for Lightbridge agents."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
futures.workspace = true
lci-agent-step = { path = "../agent-step" }
lci-agent-tools = { path = "../agent-tools" }
lci-agent-types = { path = "../agent-types" }
serde.workspace = true
serde_json.workspace = true
# Per-turn `agent.turn` span (ticket #246) — bridged into an OTel span by whichever binary registers
# `tracing-opentelemetry`'s layer process-wide; this crate itself stays otel-unaware.
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
uuid.workspace = true
