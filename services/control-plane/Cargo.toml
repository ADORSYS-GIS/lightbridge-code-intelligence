[package]
name = "control-plane"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightbridge control plane: HTTP control surface + OAuth2 resource server (OIDC/JWT)."

[[bin]]
name = "control-plane"
path = "src/main.rs"

# Versions + features are centralized in the workspace root Cargo.toml.
[dependencies]
anyhow.workspace = true
lci-config = { path = "../config" }
lci-observability = { path = "../observability" }
# StepRuntime seam (ADR-0107): generalizes the durability boundary proven by the review/open agent
# loop (ADR-0087) to webhook ingress, the dispatcher, the reconciler, and A2A task lifecycle.
lci-agent-step = { path = "../agent-step" }
lci-agent-types = { path = "../agent-types" }
thiserror.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
async-trait.workspace = true
axum.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rustls.workspace = true
# A2A push-notification webhook egress (ADR-0079): URL parsing + SSRF extra-CIDR deny-list.
url.workspace = true
ipnet.workspace = true
# AEAD (ChaCha20-Poly1305) encryption-at-rest for the webhook auth token (ADR-0079 §3); base64 decodes
# the 32-byte key from `A2A_PUSH_TOKEN_KEY`. `ring` is already the pinned rustls crypto provider.
ring.workspace = true
base64.workspace = true
# Tolerant JSONC parsing for `.lightbridge-code-review.jsonc` (ADR-0030/ADR-0103): resolving a task's
# preset needs the repo's `preset`/`entry_points` fields before any clone exists.
jsonc-parser.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
subtle.workspace = true
uuid.workspace = true
time.workspace = true
sqlx.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
neo4rs.workspace = true
rmcp.workspace = true
futures.workspace = true
async-stream.workspace = true
# A2A agent surface (RFC-0006 / #299): the `a2a` role serves these SDK traits over our Postgres state.
a2a-lf.workspace = true
a2a-server-lf.workspace = true

[dev-dependencies]
# Test-only: generate an RSA keypair at runtime so no private key is committed (see src/jwt.rs).
rsa.workspace = true
rand_08.workspace = true
# HTTP mocking for platform-API integration tests (e.g. GitLab's repository-file-content fetch during
# ADR-0103 preset resolution) — no live GitLab/GitHub/Bitbucket needed.
wiremock.workspace = true
