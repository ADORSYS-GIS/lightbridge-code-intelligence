[package]
name = "control-plane"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightbridge control plane: HTTP control surface + OAuth2 resource server (OIDC/JWT)."

[[bin]]
name = "control-plane"
path = "src/main.rs"

# Versions + features are centralized in the workspace root Cargo.toml.
[dependencies]
anyhow.workspace = true
lci-config = { path = "../config" }
lci-observability = { path = "../observability" }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
async-trait.workspace = true
axum.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rustls.workspace = true
# A2A push-notification webhook egress (ADR-0079): URL parsing + SSRF extra-CIDR deny-list.
url.workspace = true
ipnet.workspace = true
# AEAD (ChaCha20-Poly1305) encryption-at-rest for the webhook auth token (ADR-0079 §3); base64 decodes
# the 32-byte key from `A2A_PUSH_TOKEN_KEY`. `ring` is already the pinned rustls crypto provider.
ring.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
subtle.workspace = true
uuid.workspace = true
time.workspace = true
sqlx.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
neo4rs.workspace = true
rmcp.workspace = true
futures.workspace = true
async-stream.workspace = true
restate-sdk.workspace = true
# A2A agent surface (RFC-0006 / #299): the `a2a` role serves these SDK traits over our Postgres state.
a2a-lf.workspace = true
a2a-server-lf.workspace = true

[dev-dependencies]
# Test-only: generate an RSA keypair at runtime so no private key is committed (see src/jwt.rs).
rsa.workspace = true
rand_08.workspace = true
# Test-only (ADR-0087 durable_step round-trip): the REAL journaled step-result types, so the sqlx
# test proves `from_value::<AssistantTurn>` / `Vec<(usize, ToolOutcome)>` rehydrate through jsonb —
# not a hand-authored Value that could drift from what the loop actually serializes.
lci-agent-types = { path = "../agent-types" }
