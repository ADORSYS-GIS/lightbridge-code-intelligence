[package]
name = "lci-codegraph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-house code-graph crate: chunking, structural graph, and embedding-prep over one tree-sitter parse (ADR-0086)."
publish = false

[lib]
path = "src/lib.rs"

# Agent-family rule (ADR-0083): NO kube/sqlx/forge deps. This crate is a pure extractor — it parses a
# checkout and returns chunk + graph values; the host maps them to the internal-API payloads and
# submits (exactly as `index_checkout` does today). It never talks to a datastore itself.
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Workspace-standard compile-time builders (ADR-0083) for wide config constructors.
bon.workspace = true
# Tree-sitter grammars — the SAME set the in-tree chunker ships (ADR-0010); the graph is edges built
# on top of the symbols these already find.
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
# Configurable ignore-list that composes with the repo `.gitignore` (ADR-0086 §4 / R3).
ignore.workspace = true
# Bounded PDF text extraction over untrusted repo input (ADR-0086 §3 / R2).
pdf-extract.workspace = true
# Pre-flight, *bounded* inflate of a PDF's content streams to catch a decompression bomb BEFORE
# `pdf-extract` (which wraps `lopdf`/`flate2`) inflates them unbounded. Already in the tree
# transitively via `pdf-extract`; pinned direct for the guard. Untrusted-input code (ADR-0086 R2).
flate2 = "1"

[dev-dependencies]
tempfile.workspace = true
# Used ONLY to synthesise a valid fixture PDF in a unit test (a proper xref table is fiddly to write
# by hand). `pdf-extract` already pulls this transitively; pinning it here as a dev-dep keeps the
# test's PDF builder explicit. Never a runtime dependency of the crate.
lopdf = "0.36"
