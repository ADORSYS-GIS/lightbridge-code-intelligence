# Pin the Rust toolchain for the whole workspace (cargo/rustup read this from the project root,
# including when builds are invoked under turbo). The default `stable` (1.91.0) is too old for
# sqlx@0.9.0, which requires rustc >= 1.94.0 — see the sqlx "rust-version" MSRV.
#
# `components` ensures rustfmt/clippy install with this toolchain regardless of the invoking
# environment's rustup profile (CI runners default to `minimal`, rustc+cargo only).
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
