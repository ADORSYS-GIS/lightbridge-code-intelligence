# Composite action: install sccache and point RUSTC_WRAPPER at the shared S3 cache.
#
# sccache caches compiler *outputs* (object files) by content hash in an S3 bucket, so a cargo build
# on one runner/branch reuses codegen produced by another. Complements Swatinem/rust-cache, which
# caches the crate *registry* + git deps (the download side) — the two do not overlap.
#
# Credentials are the SCCACHE_S3_* repo secrets, aliased into the AWS_* env vars sccache reads for
# its S3 backend (the plain AWS_* secrets are reserved for other uses). If any of the bucket /
# endpoint / access-key are empty — e.g. a fork PR, where secrets are not exposed — this action
# installs the binary but does NOT set RUSTC_WRAPPER, so the build proceeds uncached instead of
# failing on an unauthenticated S3 call. (mozilla-actions/sccache-action does not set RUSTC_WRAPPER
# itself — it only adds sccache to PATH — so leaving it unset here is sufficient; the explicit
# empty-assign on the skip path is future-proofing against that changing.)
name: Rust sccache
description: Install sccache and configure the shared S3 compiler cache for cargo builds.

inputs:
  bucket:
    description: S3 bucket name (vars.SCCACHE_BUCKET). Empty → cache disabled.
    required: false
    default: ""
  endpoint:
    description: S3 endpoint host (vars.SCCACHE_ENDPOINT). Empty → cache disabled.
    required: false
    default: ""
  access-key-id:
    description: S3 access key (secrets.SCCACHE_S3_ACCESS_KEY_ID). Empty on fork PRs → cache disabled.
    required: false
    default: ""
  secret-access-key:
    description: S3 secret key (secrets.SCCACHE_S3_SECRET_ACCESS_KEY).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.10
    - name: Configure sccache S3 backend
      shell: bash
      # Pass every value through env (not inline ${{ }} in the script body) so an empty or
      # special-character value can never break the shell.
      env:
        SCCACHE_S3_BUCKET: ${{ inputs.bucket }}
        SCCACHE_S3_ENDPOINT: ${{ inputs.endpoint }}
        SCCACHE_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        SCCACHE_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        if [ -z "$SCCACHE_S3_BUCKET" ] || [ -z "$SCCACHE_S3_ENDPOINT" ] || [ -z "$SCCACHE_ACCESS_KEY_ID" ]; then
          echo "::notice::sccache config/credentials absent (fork PR?) — compiling without the shared cache."
          # Neutralize any wrapper a future sccache-action version might set; cargo ignores an empty value.
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          exit 0
        fi
        # Export the sccache S3 config into *this step's* environment first, then health-check the
        # server against the real backend before committing later steps to it. A transient S3
        # cold-start / unreachable-service flake ("Timed out waiting for server startup") must
        # degrade to an uncached-but-green build, never a red lint.
        export CARGO_INCREMENTAL=0
        export SCCACHE_BUCKET="$SCCACHE_S3_BUCKET"
        export SCCACHE_ENDPOINT="$SCCACHE_S3_ENDPOINT"
        export SCCACHE_S3_USE_SSL=true
        # opendal's S3 backend has no region auto-detection against a custom endpoint and errors
        # "region is missing" without this. MinIO accepts (and defaults to) us-east-1.
        export SCCACHE_REGION=us-east-1
        export AWS_ACCESS_KEY_ID="$SCCACHE_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$SCCACHE_SECRET_ACCESS_KEY"
        if timeout 90 sccache --start-server >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then
          {
            echo "RUSTC_WRAPPER=sccache"
            # Incremental compilation and sccache are mutually exclusive; incremental artifacts are not
            # cacheable, so disabling it lets sccache cache every codegen unit.
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_BUCKET=$SCCACHE_S3_BUCKET"
            echo "SCCACHE_ENDPOINT=$SCCACHE_S3_ENDPOINT"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "SCCACHE_REGION=us-east-1"
            echo "AWS_ACCESS_KEY_ID=$SCCACHE_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$SCCACHE_SECRET_ACCESS_KEY"
          } >> "$GITHUB_ENV"
          echo "sccache enabled → s3://$SCCACHE_S3_BUCKET @ $SCCACHE_S3_ENDPOINT"
        else
          echo "::warning::sccache server did not start / could not reach the S3 backend within 90s — compiling uncached (build stays green)."
          # Neutralize any wrapper so cargo compiles directly instead of through a dead sccache.
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
        fi
