# Composite action: install sccache and point RUSTC_WRAPPER at the shared S3 cache.
#
# sccache caches compiler *outputs* (object files) by content hash in an S3 bucket, so a cargo build
# on one runner/branch reuses codegen produced by another. Complements Swatinem/rust-cache, which
# caches the crate *registry* + git deps (the download side) — the two do not overlap.
#
# Credentials are the SCCACHE_S3_* repo secrets, aliased into the AWS_* env vars sccache reads for
# its S3 backend (the plain AWS_* secrets are reserved for other uses). If `access-key-id` is empty
# — e.g. a fork PR, where secrets are not exposed — this action installs the binary but does NOT set
# RUSTC_WRAPPER, so the build proceeds uncached instead of failing on an unauthenticated S3 call.
name: Rust sccache
description: Install sccache and configure the shared S3 compiler cache for cargo builds.

inputs:
  bucket:
    description: S3 bucket name (vars.SCCACHE_BUCKET).
    required: true
  endpoint:
    description: S3 endpoint host (vars.SCCACHE_ENDPOINT).
    required: true
  access-key-id:
    description: S3 access key (secrets.SCCACHE_S3_ACCESS_KEY_ID). Empty on fork PRs → cache disabled.
    required: false
    default: ""
  secret-access-key:
    description: S3 secret key (secrets.SCCACHE_S3_SECRET_ACCESS_KEY).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.10
    - name: Configure sccache S3 backend
      shell: bash
      env:
        SCCACHE_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        SCCACHE_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        if [ -z "$SCCACHE_ACCESS_KEY_ID" ]; then
          echo "::notice::sccache credentials absent (fork PR?) — compiling without the shared cache."
          exit 0
        fi
        {
          echo "RUSTC_WRAPPER=sccache"
          # Incremental compilation and sccache are mutually exclusive; incremental artifacts are not
          # cacheable, so disabling it lets sccache cache every codegen unit.
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_BUCKET=${{ inputs.bucket }}"
          echo "SCCACHE_ENDPOINT=${{ inputs.endpoint }}"
          echo "SCCACHE_S3_USE_SSL=true"
          echo "AWS_ACCESS_KEY_ID=$SCCACHE_ACCESS_KEY_ID"
          echo "AWS_SECRET_ACCESS_KEY=$SCCACHE_SECRET_ACCESS_KEY"
        } >> "$GITHUB_ENV"
        echo "sccache enabled → s3://${{ inputs.bucket }} @ ${{ inputs.endpoint }}"
