# Release automation (googleapis/release-please-action).
#
# On every push to main, release-please maintains a single, repo-wide "release PR" that
# accumulates the pending CHANGELOG (grouped by conventional-commit type) and the next
# semantic version. Merging that PR tags `v<version>` and cuts a GitHub Release. That tag
# is the loop's payoff: build-images.yml (`tags: ["v*"]`) then publishes cosign-signed,
# semver-tagged images (`type=semver` → ghcr.io/<owner>/lightbridge-*:<version>) that the
# ai-helm deployment can pin. Continuous `sha-<gitsha>` delivery is unchanged — this adds a
# named, releasable version on top of it, it does not replace the sha promotion.
#
# ## Versioning
# Pre-1.0 policy (config): `feat` → minor, `fix`/`perf` → patch, breaking (`feat!` /
# `BREAKING CHANGE`) → minor (capped below 1.0.0 via `bump-minor-pre-major`). This matches
# the existing v0.1.0 → v0.2.0 cadence. Version state lives in .release-please-manifest.json;
# section mapping + policy live in release-please-config.json. `release-type: simple` means the
# release PR touches only CHANGELOG.md + the manifest — it never rewrites Cargo.toml/package.json
# (those crate versions are independent and unpublished; the git tag is the release unit).
#
# ## Token (why not GITHUB_TOKEN)
# A tag/PR created with the default GITHUB_TOKEN does NOT trigger other workflows, so the
# `v*` tag would never fire build-images' publish job. release-please therefore runs under
# RELEASE_PLEASE_TOKEN — a fine-grained PAT (or GitHub App installation token) with
# `contents: write` + `pull_requests: write` on this repo. Create it as a repo/org secret;
# without it the workflow fails fast rather than silently opening un-publishable releases.
#
# Pinned to the v5.0.0 commit SHA (not a movable tag) because it runs with a write-scoped
# PAT — same hardening rationale as governance.yml. Bump the SHA deliberately.
name: Release Please

on:
  push:
    branches: [main]

# Minimal default; the job itself declares what it needs. (When RELEASE_PLEASE_TOKEN is a PAT
# these govern the fallback GITHUB_TOKEN only, but keep them tight regardless.)
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # googleapis/release-please-action @ v5.0.0
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
