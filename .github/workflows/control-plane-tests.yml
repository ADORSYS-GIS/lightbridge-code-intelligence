# Run the control-plane Rust test suite, including the `#[sqlx::test]` integration tests that
# need a live Postgres. These were previously local-only (they require a reachable DATABASE_URL),
# so schema regressions slipped through unnoticed — e.g. migration 0005 widening the embedding
# column to vector(4096) left a test inserting a 1536-dim vector that only failed against a real DB
# (#132 / #134). This job closes that gap.
name: Control plane tests

on:
  push:
    branches: [main]
    paths:
      - "services/control-plane/**"
      - "services/config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/control-plane-tests.yml"
  pull_request:
    paths:
      - "services/control-plane/**"
      - "services/config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/control-plane-tests.yml"

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: control-plane-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, vymalo-vps]
    # The vymalo-vps hosts lack a C toolchain (native builds fail `linker 'cc' not found`). Run inside
    # the org's ARC image (build-essential + rustup stable + sccache baked); `--user root` because the
    # host user cannot sudo. The pgvector service below shares the job's container network and is
    # reachable by its service name (`postgres`), not `localhost` — see DATABASE_URL.
    container:
      image: ghcr.io/vymalo/arc-runners:latest
      options: --user root
    services:
      # pgvector/pgvector:pg17 mirrors compose.yaml: the migrations do `CREATE EXTENSION vector`
      # and create `vector(4096)` columns, so a stock postgres image would fail. `#[sqlx::test]`
      # provisions a throwaway database per test (the `lightbridge` superuser can CREATE DATABASE)
      # and runs the migrations itself. Neo4j is not needed — the one graph test is `#[ignore]`d.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lightbridge
          POSTGRES_PASSWORD: lightbridge
          POSTGRES_DB: lightbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Inside a `container:` job the service is reached by service name, not localhost.
      DATABASE_URL: postgres://lightbridge:lightbridge@postgres:5432/lightbridge
    steps:
      - uses: actions/checkout@v4
      # Registry + git-dep download cache (the fetch side). sccache below caches compiler output.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      # Shared S3 compiler cache — persists codegen across runners/branches (target/ cache mounts do not).
      - uses: ./.github/actions/rust-sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
      - name: cargo test -p control-plane
        run: cargo test -p control-plane --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
