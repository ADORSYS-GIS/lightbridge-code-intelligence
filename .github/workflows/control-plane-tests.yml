# Run the control-plane Rust test suite, including the `#[sqlx::test]` integration tests that
# need a live Postgres. These were previously local-only (they require a reachable DATABASE_URL),
# so schema regressions slipped through unnoticed — e.g. migration 0005 widening the embedding
# column to vector(4096) left a test inserting a 1536-dim vector that only failed against a real DB
# (#132 / #134). This job closes that gap.
name: Control plane tests

on:
  push:
    branches: [main]
    paths:
      - "services/control-plane/**"
      - "services/config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/control-plane-tests.yml"
  pull_request:
    paths:
      - "services/control-plane/**"
      - "services/config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/control-plane-tests.yml"

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: control-plane-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The `vymalo-vps` label now resolves to ARC pod runners whose image
    # (ghcr.io/vymalo/arc-runners:jdk21-node22) bakes build-essential + rustup stable + sccache +
    # rootless podman. There is no Docker daemon on these pods, so GitHub Actions `services:` (which
    # launch via Docker) do not work — Postgres is started with rootless `podman run` below and reached
    # over the published localhost port, not a service-network hostname.
    env:
      # The pgvector container publishes 5432 to localhost, so the tests connect to 127.0.0.1.
      DATABASE_URL: postgres://lightbridge:lightbridge@127.0.0.1:5432/lightbridge
    steps:
      - uses: actions/checkout@v4
      # pgvector/pgvector:pg17 mirrors compose.yaml: the migrations do `CREATE EXTENSION vector` and
      # create `vector(4096)` columns, so a stock postgres image would fail. `#[sqlx::test]` provisions
      # a throwaway database per test (the `lightbridge` superuser can CREATE DATABASE) and runs the
      # migrations itself. Neo4j is not needed — the one graph test is `#[ignore]`d. Started with
      # rootless podman (no Docker daemon on the ARC pods) and published to 127.0.0.1:5432.
      - name: Start Postgres (pgvector, rootless podman)
        run: |
          podman run -d --name pg \
            -p 5432:5432 \
            -e POSTGRES_USER=lightbridge \
            -e POSTGRES_PASSWORD=lightbridge \
            -e POSTGRES_DB=lightbridge \
            docker.io/pgvector/pgvector:pg17
      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if podman exec pg pg_isready -U lightbridge -d lightbridge >/dev/null 2>&1; then
              echo "postgres is ready"
              exit 0
            fi
            echo "waiting for postgres ($i/30)…"
            sleep 2
          done
          echo "::error::postgres did not become ready in time"
          podman logs pg || true
          exit 1
      # Registry + git-dep download cache (the fetch side). sccache below caches compiler output.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      # Shared S3 compiler cache — persists codegen across runners/branches (target/ cache mounts do not).
      - uses: ./.github/actions/rust-sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
      - name: cargo test -p control-plane
        run: cargo test -p control-plane --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
      # The ARC pod is ephemeral (torn down after the job), but stop the DB explicitly so a reused
      # runner never collides on the container name or the published port.
      - name: Stop Postgres
        if: always()
        run: podman rm -f pg || true
