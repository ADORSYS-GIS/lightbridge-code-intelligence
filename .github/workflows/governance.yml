# Per-repo caller workflow for AI Governance PR enforcement.
#
# Drop this file at .github/workflows/governance.yml in a consuming repo to opt in.
# It delegates to the reusable workflow hosted in ADORSYS-GIS/ai-governance, which
# fails the PR if its body is missing an AI Usage Declaration, a source-of-truth
# reference, or verification evidence — and posts a sticky comment listing what's missing.
#
# Source of truth: https://adorsys-gis.github.io/ai-governance/
#
# The reusable workflow is pinned to an immutable commit SHA (not @main or a movable tag), so
# a future push — or a moved tag — to ai-governance cannot change what runs here with write
# access. Bump the SHA deliberately when adopting a newer governance revision. Currently pinned
# to the main commit that introduced the `runs-on` input (post-v1.0.0), so this check can run on
# our self-hosted runners instead of GitHub-hosted ubuntu-latest.
name: AI Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  governance:
    # Skip release-please's automated release PRs: they are mechanical version-bump +
    # CHANGELOG PRs with no human intent to declare, so they can't (and shouldn't) carry an
    # AI Usage Declaration / source-of-truth / verification body. release-please opens them
    # from `release-please--branches--<target>`. If governance-check is a *required* status
    # check in branch protection, a skipped job reports no status — admin-merge the release
    # PR (sole-maintainer flow) or mark this check non-required.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    # ADORSYS-GIS/ai-governance @ main ac9e071 (adds the `runs-on` input; v1.0.0 predates it)
    uses: ADORSYS-GIS/ai-governance/.github/workflows/governance-check.yml@ac9e07188e34ca435d97e57c910d7d4a29895683
    # Run on our self-hosted vymalo-vps runners (org GitHub-hosted ubuntu-latest is billing-
    # blocked). The check is a lightweight github-script PR-body validation — no toolchain or
    # container needed, so the bare runner suffices.
    with:
      runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read