name: dashboards

# Verify the committed Grafana dashboards are in sync with the generator, and that the
# observability Helm chart renders. Dashboards are generated artifacts (tools/dashboard-gen) — a
# stale deploy/observability/dashboards/ fails this check.

on:
  pull_request:
    paths:
      - "tools/dashboard-gen/**"
      - "deploy/observability/**"
      - ".github/workflows/dashboards.yml"
  push:
    branches: [main]
    paths:
      - "tools/dashboard-gen/**"
      - "deploy/observability/**"

permissions:
  contents: read

jobs:
  generate-and-verify:
    runs-on: [self-hosted, vymalo-vps]
    # The `vymalo-vps` label now resolves to ARC pod runners (Ubuntu 24.04 noble base) whose image
    # already ships system `python3` (3.12) + `python3-venv` + git. No Docker daemon on these pods, so
    # steps run directly on the runner — no `container:` wrapper. The dependencies are installed into a
    # throwaway venv (noble's system Python is PEP-668 externally-managed, so a bare `pip install`
    # would be rejected), and the generator is invoked via that venv's interpreter.
    steps:
      - uses: actions/checkout@v4
      - name: Install generator
        run: |
          python3 -m venv .dashboard-venv
          ./.dashboard-venv/bin/pip install --upgrade pip
          ./.dashboard-venv/bin/pip install -r tools/dashboard-gen/requirements.txt
      - name: Regenerate dashboards
        working-directory: tools/dashboard-gen
        run: ../../.dashboard-venv/bin/python generate.py
      - name: Fail if dashboards are out of date
        run: |
          if ! git diff --exit-code -- deploy/observability/dashboards; then
            echo "::error::Dashboards are stale. Run 'python tools/dashboard-gen/generate.py' and commit the result."
            exit 1
          fi

  helm-lint:
    runs-on: [self-hosted, vymalo-vps]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/observability
      - name: Render chart
        run: helm template lci-obs deploy/observability > /dev/null
