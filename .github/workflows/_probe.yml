name: _probe

on:
  push:
    branches: [ci/runners-vymalo-vps]
    paths:
      - ".github/workflows/_probe.yml"

permissions:
  contents: read

jobs:
  host-probe:
    runs-on: [self-hosted, vymalo-vps]
    steps:
      - name: OS + user
        run: |
          echo "=== whoami / id ==="; id || true
          echo "=== os-release ==="; cat /etc/os-release || true
          echo "=== uname ==="; uname -a || true
      - name: sudo availability
        run: |
          echo "=== which sudo ==="; which sudo || echo "NO sudo binary"
          echo "=== sudo -n true ==="; sudo -n true 2>&1 && echo "SUDO_OK" || echo "SUDO_FAIL"
          echo "=== apt-get via sudo (dry) ==="; sudo -n apt-get -s install -y build-essential 2>&1 | tail -5 || echo "APT_DRY_FAIL"
      - name: container backend
        run: |
          echo "=== docker ==="; which docker && docker version 2>&1 | head -5 || echo "NO docker"
          echo "=== podman ==="; which podman && podman version 2>&1 | head -5 || echo "NO podman"
          echo "=== DOCKER_HOST ==="; echo "${DOCKER_HOST:-unset}"
      - name: cc presence
        run: |
          echo "=== cc/gcc ==="; which cc gcc 2>&1 || echo "NO cc/gcc"

  container-probe:
    runs-on: [self-hosted, vymalo-vps]
    container: debian:bookworm-slim
    steps:
      - name: inside container
        run: |
          echo "=== CONTAINER JOB RAN ==="
          cat /etc/os-release | head -2
          which cc gcc || echo "no cc (expected in slim)"

  service-probe:
    runs-on: [self-hosted, vymalo-vps]
    container: debian:bookworm-slim
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lightbridge
          POSTGRES_PASSWORD: lightbridge
          POSTGRES_DB: lightbridge
        options: >-
          --health-cmd "pg_isready -U lightbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: reach postgres service by name
        run: |
          apt-get update && apt-get install -y --no-install-recommends postgresql-client >/dev/null 2>&1 || echo "apt failed"
          echo "=== pg_isready against host 'postgres' ==="
          pg_isready -h postgres -U lightbridge && echo "SERVICE_REACHABLE" || echo "SERVICE_UNREACHABLE"
