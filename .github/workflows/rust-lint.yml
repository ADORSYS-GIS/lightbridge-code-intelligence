# Workspace-wide Rust architecture/lint gate: dependency hygiene, `cargo fmt --check`, and
# `cargo clippy -D warnings`. The first populated `lci-*` crate also starts the per-crate coverage
# floor required by ADR-0083.
#
# Why this exists: the other CI (build-images, control-plane-tests) compiles and tests but never
# checked formatting or lints, so `cargo fmt` drift and clippy warnings landed on `main` unnoticed
# (e.g. an over-width assert merged in #169 — it only surfaced when a later branch ran `fmt --check`
# locally). This job closes that gap for the whole Cargo workspace (control-plane, agent-runner,
# config, xtask). No services needed — fmt is text-only and clippy compiles without a database
# (the code uses runtime `sqlx::query`, not the compile-time-checked macros).
name: Rust lint

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "services/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/rust-lint.yml"
  pull_request:
    paths:
      - "clients/**"
      - "services/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/rust-lint.yml"

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      # sccache caches dependency codegen (the bulk of clippy's wall-clock). The final clippy-driver
      # pass on the workspace crates is not sccache-cacheable, and fmt does not compile — so the win
      # here is the dependency graph, still worth it and free.
      - uses: ./.github/actions/rust-sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
      - name: dependency hygiene
        run: cargo xtask dependency-hygiene
      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: lci-agent-types line coverage
        run: cargo llvm-cov -p lci-agent-types --locked --fail-under-lines 85
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
