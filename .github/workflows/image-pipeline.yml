# Reusable image pipeline (ADR-0080): compile natively → assemble with buildah → push + cosign-sign.
#
# Nothing is compiled inside a container. The Rust workspace builds natively on the runner as a
# static-musl binary (sccache); the web app builds natively via pnpm + Turbo remote cache. Those
# artifacts are assembled into images by buildah — daemonless, no Docker engine — over COPY-only
# Dockerfiles.
#
# Called by:
#   - build-images.yml — on PRs (push=false, validate only) and on push to main / v* tags
#     (push=true, version="" → tags derive from the git ref: branch + semver-on-tag + sha-<gitsha>
#     + latest-on-default — today's behavior, unchanged).
#   - release-please.yml — when a release is cut (push=true, version="vX.Y.Z" → the images are
#     tagged with ONLY that semver, e.g. :0.3.0). release-please tags under the default GITHUB_TOKEN,
#     and a tag pushed by GITHUB_TOKEN cannot trigger build-images' own `tags: ["v*"]` run — so the
#     release run builds and publishes the versioned image itself, in-workflow, no PAT required. The
#     plain main push that merged the release PR still runs build-images.yml, which owns the
#     sha-<gitsha> + latest tags for that commit; the two are complementary and target one digest.
name: Image pipeline

on:
  workflow_call:
    inputs:
      push:
        description: Push to GHCR + cosign-sign (false = build/assemble only, for PR validation).
        type: boolean
        required: false
        default: false
      version:
        description: >-
          When set (e.g. "v0.3.0"), tag the images with ONLY that semver. When empty, derive tags
          from the git ref (branch + semver-on-tag + sha- + latest-on-default).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # ── Compile the Rust workspace natively → one static-musl binary per service ──────────────────────
  rust-build:
    runs-on: [self-hosted, vymalo-vps]
    # The `vymalo-vps` label now resolves to ARC pod runners whose image
    # (ghcr.io/vymalo/arc-runners:jdk21-node22) bakes build-essential + rustup stable + sccache. No
    # Docker daemon on these pods, so steps run directly on the runner — no `container:` wrapper.
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      # musl-gcc (musl-tools) links the static target; cmake+clang build aws-lc-sys' C/asm for musl.
      # Add the musl target to the runner's baked stable toolchain. The ARC runner user has
      # password-less sudo for apt, so install the musl bits with sudo.
      - name: Install musl + C toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake clang file
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - uses: ./.github/actions/rust-sccache
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
      - name: cargo build --release (static musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked --target "$TARGET" -p control-plane -p agent-runner -p lci-review-mcp
          mkdir -p dist
          cp "target/$TARGET/release/control-plane" "target/$TARGET/release/agent-runner" \
             "target/$TARGET/release/lci-review-mcp" dist/
          file dist/*
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
      # Hand the binaries to the images job via Actions cache (run-unique key), NOT upload-artifact:
      # artifact storage is a hard quota that fails closed, whereas cache is a separate LRU store that
      # never blocks the build.
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: rust-bins-${{ github.run_id }}

  # ── Compile the Next.js app natively → the standalone bundle ──────────────────────────────────────
  web-build:
    runs-on: [self-hosted, vymalo-vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: turbo build (remote cache)
        env:
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          # NEXT_PUBLIC_* vars are inlined into the client bundle at `next build` time (ADR-0102) —
          # setting this at deploy/runtime instead would have no effect, the value is already baked
          # into the compiled JS by then. Not a secret: it's a public URL and ends up in the bundle
          # either way.
          NEXT_PUBLIC_GRAFANA_URL: https://grafana.ai.camer.digital
        run: pnpm turbo run build --filter=@lightbridge/web
      - name: Stage bundle
        run: |
          mkdir -p web/standalone web/static web/public
          cp -a apps/web/.next/standalone/. web/standalone/
          cp -a apps/web/.next/static/.     web/static/
          cp -a apps/web/public/.           web/public/
      - uses: actions/cache/save@v4
        with:
          path: web
          key: web-bundle-${{ github.run_id }}

  # ── Assemble images from the prebuilt artifacts, daemonless, with rootless podman ─────────────────
  images:
    needs: [rust-build, web-build]
    runs-on: [self-hosted, vymalo-vps]
    permissions:
      contents: read
      packages: write # push (inputs.push only)
      id-token: write # cosign keyless (inputs.push only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lightbridge-control-plane
            dockerfile: services/control-plane/Dockerfile
            target: ""
            artifact: rust-bins
          - image: lightbridge-web
            dockerfile: apps/web/Dockerfile
            target: ""
            artifact: web-bundle
          # Two agent images from one Dockerfile. Since Graphify was retired (ADR-0086) both targets
          # alias one lean runtime and build to the same image; kept as separate tags for the two Job
          # kinds. Both COPY the same runner binary from context.
          - image: lightbridge-agent-runner
            dockerfile: services/agent-runner/Dockerfile
            target: indexer
            artifact: rust-bins
          # ADR-0097 cutover: the review image is now OpenCode-based (the agent-runner Job binary
          # spawns `opencode acp` + the stdio lci-review-mcp + the plugins). The image NAME is
          # unchanged, so ai-helm-values needs NO edit — merging this rebuilds lightbridge-agent-review
          # as the opencode image and argocd-image-updater promotes it (that promotion IS the go-live).
          # The old debian `review` target in services/agent-runner/Dockerfile stays (unused) until the
          # follow-up that removes run_native_agent.
          - image: lightbridge-agent-review
            dockerfile: services/agent-runner/Dockerfile.review-opencode
            target: ""
            artifact: rust-bins
    steps:
      - uses: actions/checkout@v4 # the Dockerfiles
      - name: Lowercase repository owner
        id: owner
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.artifact == 'rust-bins' && 'dist' || 'web' }}
          key: ${{ matrix.artifact }}-${{ github.run_id }}
          fail-on-cache-miss: true
      # These self-hosted hosts are rootless-podman hosts with no password-less sudo, so the images
      # are assembled with rootless `podman build` (buildah's engine, daemonless) directly on the
      # host — no buildah install, no sudo, no nested container.
      - uses: sigstore/cosign-installer@v3
        if: ${{ inputs.push }}
      # Let podman resolve bare base-image names (node:22-slim, python:…, debian:…) to Docker Hub
      # non-interactively; gcr.io/distroless is already fully qualified. Written to the per-user
      # config (no sudo); the host's registries.conf.d short-name aliases are still merged in.
      - name: Configure podman registries
        run: |
          mkdir -p "$HOME/.config/containers"
          cat > "$HOME/.config/containers/registries.conf" <<'EOF'
          unqualified-search-registries = ["docker.io"]
          short-name-mode = "permissive"
          EOF
      - name: Stage build context
        id: ctx
        run: |
          ctx="$(mktemp -d)"
          case "${{ matrix.artifact }}" in
            rust-bins)
              cp dist/* "$ctx"/ && chmod +x "$ctx"/*
              # The review-opencode image also needs the first-party plugins (ADR-0095) — the buildah
              # context is dist/-only, so stage them here from the checkout under a context-relative
              # name. node_modules is gitignored (absent from the checkout); pruned defensively.
              mkdir -p "$ctx"/opencode-plugins
              cp -r integrations/opencode/plugins/. "$ctx"/opencode-plugins/
              find "$ctx"/opencode-plugins -type d -name node_modules -prune -exec rm -rf {} +
              ;;
            web-bundle) cp -a web/standalone web/static web/public "$ctx"/ ;;
          esac
          echo "dir=$ctx" >> "$GITHUB_OUTPUT"
      # Tag strings only — metadata-action needs no Docker daemon. With an explicit `version` (release
      # path) emit ONLY that semver; otherwise reproduce the original ref-derived tag set exactly.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,enable=${{ inputs.version == '' }}
            type=raw,value=latest,enable=${{ inputs.version == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build (podman)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          CTX: ${{ steps.ctx.outputs.dir }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=(--platform linux/amd64 -f "$DOCKERFILE")
          [ -n "$TARGET" ] && args+=(--target "$TARGET")
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          podman build "${args[@]}" "$CTX"
      - name: Report image size
        continue-on-error: true
        run: |
          size=$(podman images --format '{{.Size}}' "ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}" | head -1)
          printf '### 📦 %s\n\n**%s**\n' "${{ matrix.image }}" "$size" >> "$GITHUB_STEP_SUMMARY"
      # push=true only: push every tag, then cosign-sign the (single) digest they share.
      - name: Push + sign
        if: ${{ inputs.push }}
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # podman pushes the image; cosign pushes the signature — each needs its own GHCR login.
          podman login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          digestfile="$(mktemp)"
          first=1
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$first" = 1 ]; then
              podman push --digestfile "$digestfile" "$tag" "docker://$tag"; first=0
            else
              podman push "$tag" "docker://$tag"
            fi
          done <<< "$TAGS"
          digest="$(cat "$digestfile")"
          echo "signing ${IMAGE}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"
